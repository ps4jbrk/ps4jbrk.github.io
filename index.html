<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070b18">
<title>PS4 Host All FW | Main Page</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="host-wrap">
  <div class="brand">Playstation 4 • ZoLDiK Host</div>
  <h1><span class="accent">PS4 FW 5.05 - 14.00</span></h1>
  <p class="subtitle">GoldHEN • by SiSTRo</p>
  <section class="status-card">
    <div class="status-label">Starting Jailbreak</div>
    <div class="progress-wrap" role="status" aria-live="polite">
      <div class="progress-ring" id="progressRing">
        <svg viewBox="0 0 160 160" aria-hidden="true">
          <circle class="ring-track" cx="80" cy="80" r="68"></circle>
          <circle class="ring-value" id="ringValue" cx="80" cy="80" r="68"></circle>
        </svg>
        <div class="progress-number"><span id="progressPercent">0</span><small>%</small></div>
      </div>
      <div class="progress-caption" id="progressCaption">Preparing exploit...</div>
      <h1 id="msgs">Jailbreak in progress... Please wait</h1>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="fw-pill" id="fwInfo">Firmware: Detecting…</div>
  </section>

<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);
function setMessage(text, color) {
  var el = document.getElementById("msgs");
  if (el) { el.textContent = text; if (color) el.style.color = color; }
}
function onScriptError() {
  setMessage("Host file missing — clear browser data and reinstall cache", "#ff9aad");
  if (window.setHostProgress) window.setHostProgress("fail", "Host file missing");
}

/* Visual progress indicator:
   it advances quickly to 90% while the exploit runs, then completes to 100%
   when the host reports a successful jailbreak / GoldHEN load. */
(function () {
  var value = 4;
  var timer = null;
  var finishTimer = null;
  var ring = document.getElementById("ringValue");
  var percent = document.getElementById("progressPercent");
  var fill = document.getElementById("progressFill");
  var caption = document.getElementById("progressCaption");
  var circumference = 2 * Math.PI * 68;
  var finished = false;

  function paint(next) {
    value = Math.max(0, Math.min(100, Math.round(next)));
    if (percent) percent.textContent = value;
    if (fill) fill.style.width = value + "%";
    if (ring) ring.style.strokeDashoffset = circumference * (1 - value / 100);
  }

  function completeProgress() {
    if (finishTimer) clearInterval(finishTimer);
    finishTimer = setInterval(function () {
      if (value >= 100) {
        clearInterval(finishTimer);
        finishTimer = null;
        if (caption) caption.textContent = "GoldHEN loaded successfully!";
        return;
      }
      paint(Math.min(100, value + 2));
    }, 25);
  }

  window.setHostProgress = function (state, message) {
    if (state === "success") {
      if (finished) return;
      finished = true;
      if (timer) clearInterval(timer);
      if (caption) caption.textContent = "Applying final patches...";
      var successHeading = document.getElementById("msgs");
      if (successHeading) successHeading.textContent = "✓ Jailbreak Completed Successfully!";
      document.body.className = "done";
      completeProgress();
    } else if (state === "fail") {
      finished = true;
      if (timer) clearInterval(timer);
      if (finishTimer) clearInterval(finishTimer);
      if (caption) caption.textContent = message || "Activation failed";
      document.body.className = "fail";
    } else if (message && caption) {
      caption.textContent = message;
    }
  };

  paint(value);
  timer = setInterval(function () {
    if (finished) return;
    if (value < 35) paint(value + 3);
    else if (value < 65) paint(value + 2);
    else if (value < 90) paint(value + 1);
    if (value >= 90) paint(90);
    if (caption) {
      if (value < 25) caption.textContent = "Initializing exploit...";
      else if (value < 55) caption.textContent = "Running jailbreak process...";
      else if (value < 80) caption.textContent = "Applying system patches...";
      else caption.textContent = "Finalizing jailbreak...";
    }
  }, 120);

  function checkMessage() {
    var el = document.getElementById("msgs");
    if (!el) return;
    var message = (el.textContent || "").toLowerCase();
    if ((message.indexOf("jailbreak") !== -1 &&
         message.indexOf("completed successfully") !== -1) ||
        (message.indexOf("goldhen") !== -1 && message.indexOf("loaded") !== -1)) {
      window.setHostProgress("success");
    } else if (message.indexOf("failed") !== -1 ||
               message.indexOf("unsupported firmware") !== -1 ||
               message.indexOf("host file missing") !== -1 ||
               message.indexOf("no offsets") !== -1) {
      window.setHostProgress("fail", "Please restart the browser and try again");
    }
  }

  if (window.MutationObserver) {
    var target = document.getElementById("msgs");
    if (target) {
      new MutationObserver(checkMessage).observe(target, {
        childList: true, characterData: true, subtree: true
      });
    }
  }
  document.addEventListener("DOMContentLoaded", checkMessage);
  setTimeout(checkMessage, 0);
})();
window.addEventListener("DOMContentLoaded", function () {
  var fw = document.getElementById("fwInfo");
  if (fw) fw.textContent = "Firmware: " + fwVersion;
  if (!isPS4) setMessage("This host is intended for PlayStation 4", "#ffcf78");
});
if (!isPS4) {
  document.addEventListener("DOMContentLoaded", function () { setMessage("Only for PS4 consoles", "#ffcf78"); });
} else if (window.applicationCache.status == '0') {
  if (fwNum == 5.05 || fwNum == 5.07) window.location.replace("cache505.html");
  else if (fwNum >= 7.00 && fwNum <= 8.52) window.location.replace("cache700.html");
  else if (fwNum >= 9.00 && fwNum <= 9.60) window.location.replace("cache900.html");
  else if (fwNum >= 10.00 && fwNum <= 11.02) window.location.replace("cachecss.html");
  else if (fwNum >= 11.50 && fwNum <= 14.00) window.location.replace("cacheslopkit.html");
  else document.addEventListener("DOMContentLoaded", function () { setMessage("Unsupported Firmware: " + fwVersion, "#ff718e"); });
} else {
  var src = null, moduleType = false;
  if (fwNum == 5.05 || fwNum == 5.07) src = "505/exploit.js";
  else if (fwNum >= 7.00 && fwNum <= 8.52) { src = "700/alert.js"; moduleType = true; }
  else if (fwNum >= 9.00 && fwNum <= 9.60) { src = "900/alert.js"; moduleType = true; }
  else if (fwNum >= 10.00 && fwNum <= 11.02) src = "css/main.js";
  else if (fwNum >= 11.50 && fwNum <= 12.02) { src = "slopkit/chain_lapse.js"; moduleType = true; }
  else if (fwNum >= 12.50 && fwNum <= 13.00) { src = "slopkit/chain_poops.js"; moduleType = true; }
  else if (fwNum >= 13.02 && fwNum <= 13.52) { src = "slopkit/jb.js?v=19"; moduleType = true; }
  else if (fwNum == 14.00) { src = "slopkit/jb2.js"; moduleType = true; }
  if (src) {
    var script = document.createElement('script');
    if (moduleType) script.type = 'module';
    script.src = src;
    script.onerror = onScriptError;
    if (src === "css/main.js") script.onload = function () { setTimeout(function () { doJb(); }, 500); };
    document.head.appendChild(script);
  } else {
    document.addEventListener("DOMContentLoaded", function () { setMessage("Unsupported Firmware: " + fwVersion, "#ff718e"); });
  }
}
</script>
</body>
</html>
